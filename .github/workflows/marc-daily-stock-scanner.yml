name: MARC Multi-Market Scanner

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: "Pilih laporan yang ingin dikirim"
        required: true
        type: choice
        default: all
        options:
          - all
          - stocks
          - evening
          - crypto
          - commodities
  schedule:
    - cron: "0 9 * * 1-5"
      timezone: "Asia/Jakarta"
    - cron: "0 21 * * *"
      timezone: "Asia/Jakarta"

permissions:
  contents: read

concurrency:
  group: marc-multi-market-scanner
  cancel-in-progress: false

jobs:
  scan-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: marc-stock-scanner/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r marc-stock-scanner/requirements.txt
      - name: Run unit tests
        working-directory: marc-stock-scanner
        run: python -m unittest discover -s tests -v
      - name: Run MARC scanner
        working-directory: marc-stock-scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARC_REPORT_TYPE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1-5' && 'stocks' || github.event_name == 'schedule' && 'evening' || inputs.report_type || 'all' }}
        run: python marc_scanner.py
